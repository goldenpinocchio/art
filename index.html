<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12100e">
  <link rel="icon" type="image/png" href="favicon_artist.png">
  <title>Pinocchio — The Fake Artist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="gallery" aria-labelledby="page-title">
    <header class="masthead">
      <h1 id="page-title">Pinocchio<br><em>The Fake Artist</em></h1>
    </header>

    <section id="stage" class="stage" aria-label="Floating art collection"></section>

    <footer class="footer-note">
      <span>All artifacts in motion</span>
      <a class="x-link" href="https://x.com/trustypinocchio" target="_blank" rel="noopener" aria-label="Follow @trustypinocchio on X">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.77 7.74L23.2 22h-6.24l-4.89-6.39L6.48 22H3.36l7.24-8.28L2.8 2h6.4l4.42 5.84L18.9 2Zm-1.1 17.8h1.73L8.3 4.08H6.45L17.8 19.8Z"/></svg>
      </a>
      <span>Supply recorded as 0</span>
    </footer>
    <div id="lightbox" class="lightbox" hidden aria-hidden="true">
      <button class="lightbox-close" type="button" aria-label="Close artwork viewer">×</button>
      <div class="lightbox-viewer">
        <div class="lightbox-card" role="button" tabindex="0" aria-label="Click to flip artwork details">
          <span class="lightbox-inner">
            <span class="lightbox-face lightbox-front"><img alt=""></span>
            <span class="lightbox-face lightbox-back">
              <span class="lightbox-name"></span>
              <span class="lightbox-meta"><strong>Supply</strong>0</span>
              <a class="lightbox-link" target="_blank" rel="noopener">View on TokenScan ↗</a>
              <span class="lightbox-flip-hint">Click to see the artwork</span>
            </span>
          </span>
        </div>
        <span class="lightbox-front-hint">Click to flip</span>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
